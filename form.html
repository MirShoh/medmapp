<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibbiy konsultatsiya uchun anketa | MedMapp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Flatpickr CSS (Sana tanlash uchun) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #eef2ff;
        }
        .modal, .success-modal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-content, .success-modal-content {
            transition: transform 0.3s ease;
        }
        .dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0) scale(1); }
            20%, 80% { transform: translate3d(2px, 0, 0) scale(1); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0) scale(1); }
            40%, 60% { transform: translate3d(4px, 0, 0) scale(1); }
        }
        .shake {
            animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Sahifadagi asosiy kontent -->
    <div class="flex items-center justify-center min-h-screen">
        <button id="openModalBtn" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition duration-300 text-lg shadow-lg">
            Murojaat yuborish
        </button>
    </div>

    <!-- Pop-up Modal -->
    <div id="formModal" class="modal fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 opacity-0 invisible z-50">
        <div class="modal-content w-full max-w-6xl mx-auto bg-white rounded-2xl shadow-2xl grid md:grid-cols-2 overflow-hidden transform scale-95 max-h-[95vh]">
            <!-- Chap ustun: Rasm -->
            <div class="hidden md:block">
                <img src="images/form.jpg" alt="Tibbiy xizmatlar" class="w-full h-full object-cover object-right">
            </div>

            <!-- O'ng ustun: Forma -->
            <div class="relative p-4 sm:p-6 md:p-10 flex flex-col overflow-hidden">
                <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition z-10">
                    <i class="ph-bold ph-x text-2xl"></i>
                </button>
                <div class="flex-shrink-0">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">Konsultatsiya uchun anketa</h1>
                    <p class="text-gray-500 mb-6">Xorijiy klinikadan tibbiy xulosa olish uchun formani to'ldiring!</p>
                </div>
                
                <!-- Ariza formasi (skroll bo'ladigan) -->
                <form id="bitrixForm" class="space-y-4 flex-grow overflow-y-auto pr-2">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label for="name" class="flex items-center mb-1 text-sm font-medium text-gray-700">
                                <i class="ph ph-user text-base mr-2 text-gray-500"></i>
                                Ism-familiya <span class="text-red-500 ml-1">*</span>
                            </label>
                            <input type="text" id="name" required class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="F.I.O">
                        </div>
                        <div>
                            <label for="dob" class="flex items-center mb-1 text-sm font-medium text-gray-700">
                               <i class="ph ph-calendar text-base mr-2 text-gray-500"></i>
                               Tug'ilgan sana <span class="text-red-500 ml-1">*</span>
                            </label>
                            <input type="text" id="dob" required class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="kun.oy.yil">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                             <label for="phone" class="flex items-center mb-1 text-sm font-medium text-gray-700">
                                <i class="ph ph-phone text-base mr-2 text-gray-500"></i>
                                Telefon raqamingiz <span class="text-red-500 ml-1">*</span>
                            </label>
                            <div class="flex items-center">
                                <span class="inline-flex items-center px-3 text-gray-500 bg-gray-100 border border-r-0 border-gray-200 rounded-l-lg h-full py-2 text-sm">+998</span>
                                <input type="tel" id="phone" required class="w-full px-3 py-2 border border-l-0 border-gray-200 bg-gray-50 rounded-r-lg focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="(90) 123-45-67">
                            </div>
                        </div>
                        <div>
                            <label for="email" class="flex items-center mb-1 text-sm font-medium text-gray-700">
                                <i class="ph ph-envelope-simple text-base mr-2 text-gray-500"></i>
                                E-mail
                            </label>
                            <input type="email" id="email" class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="e-mail@gmail.com">
                        </div>
                    </div>
                    
                    <div>
                        <label for="requirements" class="flex items-center mb-1 text-sm font-medium text-gray-700">
                            <i class="ph ph-chat-circle-dots text-base mr-2 text-gray-500"></i>
                            Sizni nima bezovta qilmoqda?
                        </label>
                        <textarea id="requirements" rows="3" class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-sm" placeholder="Avvalgi tashxislar (mavjud bo'lsa)"></textarea>
                    </div>

                    <div>
                        <label class="flex items-center mb-1 text-sm font-medium text-gray-700">
                            <i class="ph ph-file-arrow-up text-base mr-2 text-gray-500"></i>
                            Tibbiy fayllar <span class="text-red-500 ml-1">*</span>
                        </label>
                        <div id="dropZone" class="w-full px-4 py-3 border-2 border-dashed border-gray-300 rounded-lg hover:border-blue-400 transition-colors">
                            <label for="medicalFiles" class="flex items-center justify-center text-gray-500 cursor-pointer">
                                <i class="ph ph-paperclip text-lg mr-2"></i>
                                <span id="fileName" class="text-sm text-center">Fayllarni tanlang yoki bu yerga tashlang</span>
                            </label>
                            <input type="file" id="medicalFiles" class="hidden" multiple>
                        </div>
                        <div id="fileList" class="mt-2 flex flex-wrap gap-2"></div>
                    </div>

                    <div class="pt-3">
                        <div class="flex items-start">
                            <input type="checkbox" id="terms" required class="h-4 w-4 mt-0.5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <label for="terms" class="ml-2 block text-sm text-gray-700">
                                Men kiritgan barcha ma'lumotlarning to'g'riligini tasdiqlayman hamda <a href="https://medmapp.uz/public-offer" target="_blank" class="text-blue-600 hover:underline font-medium">Ommaviy oferta</a> va <a href="https://medmapp.uz/privacy-policy" target="_blank" class="text-blue-600 hover:underline font-medium">Maxfiylik siyosati</a> bilan tanishib chiqdim. <span class="text-red-500">*</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="submitButton" class="w-full flex-shrink-0 flex items-center justify-center bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300 disabled:bg-blue-400">
                        <i class="ph ph-paper-plane-tilt text-xl mr-2"></i>
                        Yuborish
                    </button>
                </form>
                <div id="statusMessage" class="mt-4 text-center text-sm font-medium flex-shrink-0"></div>
            </div>
        </div>
    </div>

    <!-- Muvaffaqiyatli xabar oynasi -->
    <div id="successModal" class="success-modal fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 opacity-0 invisible z-50">
        <div class="success-modal-content bg-white rounded-2xl shadow-xl p-8 text-center max-w-sm mx-auto transform scale-95">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="ph-bold ph-check text-4xl text-green-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Muvaffaqiyatli!</h2>
            <p class="text-gray-600 mb-6">Murojaatingiz qabul qilindi! Tez orada operatorlarimiz siz bilan bog'lanishadi.</p>
            <button id="closeSuccessModalBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300">Yopish</button>
        </div>
    </div>
    
    <!-- JS skriptlar -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/uz_latn.js"></script>
    <script src="https://unpkg.com/imask"></script>

    <script>
        // DOM elementlari
        const form = document.getElementById('bitrixForm');
        const submitButton = document.getElementById('submitButton');
        const statusMessage = document.getElementById('statusMessage');
        const medicalFilesInput = document.getElementById('medicalFiles');
        const fileListDisplay = document.getElementById('fileList');
        const fileNameDisplay = document.getElementById('fileName');
        const dropZone = document.getElementById('dropZone');
        
        let selectedFiles = [];

        // Modal elementlari
        const modal = document.getElementById('formModal');
        const modalContent = modal.querySelector('.modal-content');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');

        // Muvaffaqiyat oynasi elementlari
        const successModal = document.getElementById('successModal');
        const successModalContent = successModal.querySelector('.success-modal-content');
        const closeSuccessBtn = document.getElementById('closeSuccessModalBtn');


        // --->>> SOZLAMALAR <<<---
        const TELEGRAM_BOT_TOKEN = 'SIZNING_TELEGRAM_BOT_TOKENINGIZ';
        const TELEGRAM_CHAT_ID = 'SIZNING_CHAT_ID';
        const BITRIX_WEBHOOK_URL = 'https://medmapp.bitrix24.ru/rest/1/qll2ixemwxbcimkg/crm.deal.add.json';
        const CUSTOM_DEAL_FILE_FIELD_ID = 'UF_CRM_BITIM_UCHUN_YANGI_ID'; 

        // Kalendar va Maska
        const dobPicker = flatpickr("#dob", {
            locale: "uz_latn", altInput: true, altFormat: "d.m.Y", dateFormat: "Y-m-d", allowInput: true,
        });
        const phoneMask = IMask(document.getElementById('phone'), { mask: '(00) 000-00-00' });

        // Ma'lumotlarni saqlash
        const saveFormData = () => {
            localStorage.setItem('formData', JSON.stringify({
                name: document.getElementById('name').value, dob: document.getElementById('dob').value,
                phone: phoneMask.unmaskedValue, email: document.getElementById('email').value,
                requirements: document.getElementById('requirements').value,
            }));
        };
        const loadFormData = () => {
            const data = JSON.parse(localStorage.getItem('formData'));
            if (data) {
                document.getElementById('name').value = data.name || '';
                dobPicker.setDate(data.dob || '', true);
                phoneMask.value = data.phone || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('requirements').value = data.requirements || '';
            }
        };
        form.querySelectorAll('input, textarea').forEach(input => {
            if(input.type !== 'file') input.addEventListener('input', saveFormData);
        });

        // Modal oynalarni boshqarish
        const openModal = () => {
            loadFormData();
            modal.classList.remove('invisible', 'opacity-0');
            modalContent.classList.remove('scale-95');
        };
        const closeModal = () => {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => modal.classList.add('invisible'), 300);
        };
        const openSuccessModal = () => {
            closeModal();
            successModal.classList.remove('invisible', 'opacity-0');
            successModalContent.classList.remove('scale-95');
        }
        const closeSuccessModal = () => {
            successModal.classList.add('opacity-0');
            successModalContent.classList.add('scale-95');
            setTimeout(() => successModal.classList.add('invisible'), 300);
        }
        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        closeSuccessBtn.addEventListener('click', closeSuccessModal);
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                 modalContent.classList.add('shake');
                 setTimeout(() => modalContent.classList.remove('shake'), 820);
            }
        });

        // Fayllar bilan ishlash
        const handleFiles = (files) => {
            Array.from(files).forEach(file => {
                if (!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                    selectedFiles.push(file);
                }
            });
            renderFileList();
        };
        const getFileIcon = (fileName) => {
            const ext = fileName.split('.').pop().toLowerCase();
            if (['pdf'].includes(ext)) return 'ph-file-pdf';
            if (['doc', 'docx'].includes(ext)) return 'ph-file-doc';
            if (['jpg', 'jpeg', 'png', 'gif'].includes(ext)) return 'ph-image';
            return 'ph-file';
        };
        const renderFileList = () => {
            fileListDisplay.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const fileElement = document.createElement('div');
                fileElement.className = "flex items-center bg-gray-100 rounded-md p-2 text-xs transition-all";
                fileElement.innerHTML = `<i class="ph ${getFileIcon(file.name)} text-lg mr-2 text-gray-500"></i><span class="truncate max-w-[120px] sm:max-w-[150px]" title="${file.name}">${file.name}</span><button type="button" data-index="${index}" class="remove-file-btn ml-auto text-red-500 hover:text-red-700"><i class="ph-bold ph-x"></i></button>`;
                fileListDisplay.appendChild(fileElement);
            });
            fileNameDisplay.textContent = selectedFiles.length > 0 ? `${selectedFiles.length} ta fayl tanlandi` : 'Fayllarni tanlang yoki bu yerga tashlang';
        };
        medicalFilesInput.addEventListener('change', (e) => handleFiles(e.target.files));
        fileListDisplay.addEventListener('click', (e) => {
            const removeBtn = e.target.closest('.remove-file-btn');
            if (removeBtn) {
                selectedFiles.splice(parseInt(removeBtn.dataset.index, 10), 1);
                renderFileList();
            }
        });
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); });
        });
        ['dragenter', 'dragover'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover')));
        ['dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover')));
        dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));

        // Formani yuborish
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            if (selectedFiles.length === 0) {
                showError("Iltimos, kamida bitta tibbiy fayl yuklang."); return;
            }

            submitButton.disabled = true;
            submitButton.innerHTML = 'Yuborilmoqda...';
            statusMessage.textContent = '';

            let filesDataForBitrix = [];
            try {
                 for (const file of selectedFiles) {
                    filesDataForBitrix.push([file.name, await toBase64(file)]);
                }
            } catch (error) {
                showError("Fayllarni o'qishda xatolik.");
                submitButton.disabled = false;
                submitButton.innerHTML = 'Yuborish';
                return;
            }
            
            try {
                const [bitrixResult, telegramResult] = await Promise.all([
                    sendToBitrix(filesDataForBitrix),
                    sendToTelegram(selectedFiles)
                ]);

                if (bitrixResult.result && telegramResult.ok) {
                    localStorage.removeItem('formData');
                    form.reset();
                    selectedFiles = [];
                    renderFileList();
                    openSuccessModal();
                } else {
                    let errorMessage = '';
                    if (!bitrixResult.result) errorMessage += `Bitrix24 xatosi: ${bitrixResult.error_description || "Noma'lum xato"}. `;
                    if (!telegramResult.ok) errorMessage += `Telegram xatosi: ${telegramResult.description || "Noma'lum xato"}.`;
                    showError(errorMessage.trim());
                }
            } catch (error) {
                showError("Xatolik yuz berdi. Iltimos, keyinroq urinib ko'ring.");
            } finally {
                submitButton.disabled = false;
                submitButton.innerHTML = `<i class="ph ph-paper-plane-tilt text-xl mr-2"></i> Yuborish`;
            }
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        function showError(message) {
            statusMessage.textContent = message;
            statusMessage.className = 'mt-4 text-center text-sm font-medium text-red-600';
        }

        const getFormData = () => ({
            name: document.getElementById('name').value, dob: document.getElementById('dob').value,
            phone: '+998' + phoneMask.unmaskedValue, email: document.getElementById('email').value,
            requirements: document.getElementById('requirements').value,
        });

        function sendToBitrix(filesData) {
            const formData = getFormData();
            const data = {
                fields: {
                    TITLE: `Saytdan ${formData.name} nomli yangi ariza`, NAME: formData.name,
                    PHONE: [{ VALUE: formData.phone, VALUE_TYPE: "WORK" }], EMAIL: [{ VALUE: formData.email, VALUE_TYPE: "WORK" }],
                    COMMENTS: `Tug'ilgan sana: ${formData.dob}\n\nMijoz talablari: ${formData.requirements}`, BIRTHDATE: formData.dob 
                }
            };
            if (filesData.length > 0 && CUSTOM_DEAL_FILE_FIELD_ID !== 'UF_CRM_BITIM_UCHUN_YANGI_ID') {
                data.fields[CUSTOM_DEAL_FILE_FIELD_ID] = filesData;
            }
            return fetch(BITRIX_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(res => res.json());
        }
        
        async function sendToTelegram(files) {
            if (TELEGRAM_BOT_TOKEN === 'SIZNING_TELEGRAM_BOT_TOKENINGIZ' || TELEGRAM_CHAT_ID === 'SIZNING_CHAT_ID') {
                return Promise.resolve({ok: false, description: "Bot sozlanmagan"});
            }
            const formData = getFormData();
            let caption = `<b>Saytdan yangi ariza!</b>\n\n`;
            caption += `<b>👤 Ism:</b> ${formData.name}\n<b>📅 T. Sana:</b> ${formData.dob}\n`;
            caption += `<b>📞 Telefon:</b> <code>${formData.phone}</code>\n<b>📧 Email:</b> ${formData.email || "Kiritilmagan"}\n`;
            caption += `<b>📝 Talablar:</b>\n${formData.requirements || "Kiritilmagan"}`;
            
            const tgFormData = new FormData();
            tgFormData.append('chat_id', TELEGRAM_CHAT_ID);
            
            if (files.length === 0) {
                tgFormData.append('text', caption);
                tgFormData.append('parse_mode', 'HTML');
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
                return fetch(url, { method: 'POST', body: tgFormData }).then(res => res.json());
            }
            
            const mediaToSend = files.map((file, index) => {
                const fileKey = `file${index}`;
                tgFormData.append(fileKey, file);
                return { type: 'document', media: `attach://${fileKey}`, caption: index === 0 ? caption : undefined, parse_mode: 'HTML' };
            });

            tgFormData.append('media', JSON.stringify(mediaToSend));
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup`;
            return fetch(url, { method: 'POST', body: tgFormData }).then(res => res.json());
        }
    </script>

</body>
</html>
