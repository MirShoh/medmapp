    <style>
        :root {
            --pricing-bg: #f8f9fa;
            --pricing-border: #dee2e6;
            --pricing-text-dark: #212529;
            --pricing-text-light: #6c757d;
            --pricing-primary: #007BFF;
            --pricing-secondary-blue: #0d324d;
        }

        /* ### ANIMATSIYALAR ### */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ### KREATIV HERO BO'LIMI ### */
        .pricing-hero-creative {
            margin-top: 2rem;
            padding: 5rem 1rem 8rem 1rem; /* Pastki padding ko'paytirildi */
            background: linear-gradient(135deg, var(--pricing-primary) 0%, var(--pricing-secondary-blue) 100%);
            position: relative;
            overflow: hidden;
            text-align: center;
            color: #fff;
        }
        .pricing-hero-creative .wave-shape {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 320'%3e%3cpath fill='%23ffffff' fill-opacity='1' d='M0,160L48,170.7C96,181,192,203,288,208C384,213,480,203,576,176C672,149,768,107,864,112C960,117,1056,171,1152,181.3C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z'%3e%3c/path%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-size: cover;
        }
        .pricing-hero-creative .container {
            position: relative;
            z-index: 2;
        }
        .pricing-hero-creative h1 {
            font-size: 3rem;
            font-weight: 800;
            animation: fadeInUp 0.5s ease-out;
        }
        .pricing-hero-creative p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 1rem auto 0 auto;
            opacity: 0.9;
            animation: fadeInUp 0.5s ease-out 0.2s;
            animation-fill-mode: backwards;
        }

        /* ### ASOSIY KONTENT ### */
        .pricing-main-section {
            padding: 2rem 1rem 4rem 1rem;
            background-color: #fff;
        }
        .pricing-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ### FILTRLAR ### */
        .pricing-filters-container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.07);
            margin-top: -8rem;
            position: relative;
            z-index: 10;
            margin-bottom: 3rem;
            animation: fadeInUp 0.5s ease-out 0.4s;
            animation-fill-mode: backwards;
        }
        .pricing-filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            align-items: flex-end;
        }
        .filter-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            color: var(--pricing-text-dark);
        }
        .filter-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--pricing-border);
            border-radius: 0.5rem;
            font-size: 1rem;
            background-color: var(--pricing-bg);
        }
        
        /* ### NATIJALAR ### */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .results-header h3 {
            font-size: 1.5rem;
            margin: 0;
        }
        #results-count {
            color: var(--pricing-text-light);
            font-weight: 500;
        }

        .pricing-results-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }
        
        .price-result-card {
            background-color: #fff;
            border: 1px solid var(--pricing-border);
            border-radius: 1rem;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 0 1 380px; /* O'zgarmas o'lcham */
            opacity: 0; /* Animatsiya uchun */
        }
        .price-result-card.visible {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .price-result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.09);
        }
        
        .card-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        
        .card-content .procedure-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: var(--pricing-text-dark);
        }
        
        .card-content .clinic-name {
            margin: 0 0 1rem 0;
            color: var(--pricing-text-light);
            font-size: 0.9rem;
        }
        
        .price-info {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--pricing-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .price-tag-results {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--pricing-primary);
        }
        
        .btn-request { 
            background-color: var(--pricing-primary); 
            color: #fff; padding: 0.7rem 1.5rem; 
            border-radius: 0.5rem; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.9rem; 
            transition: background-color 0.3s ease; 
        }
        .btn-request:hover { background-color: #0056b3; }
        
        #no-results { text-align: center; padding: 3rem; color: var(--pricing-text-light); background-color: var(--pricing-bg); border-radius: 1rem; width: 100%;}

    </style>
</head>
<body>

    <header class="header">
        <div class="header-logo"> 
            <a href="index.html">
                <img src="images/logo/MedMapp_logo_main_shaffof.png" alt="MedMapp Logosi">
            </a>
        </div>
    
        <nav class="header-nav">

        <div class="header-actions">
            <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            
            <div class="language-selector">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                <span>UZ</span>
                <svg class="chevron-down" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>
        </div>
    
        <button class="hamburger-menu" aria-label="Menyuni ochish">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

    <main>
        <section class="pricing-hero-creative">
            <div class="container">
                <h1>Shaffof Narxlarni Solishtiring</h1>
                <p>Eng yaxshi klinikalardagi davolash narxlarini solishtiring va o'zingiz uchun eng ma'qulini tanlang.</p>
            </div>
            <div class="wave-shape"></div>
        </section>

        <section class="pricing-main-section">
            <div class="pricing-container">
                <div class="pricing-filters-container">
                    <div class="pricing-filters-grid">
                        <div class="filter-group">
                            <label for="filter-department">Yo'nalishni tanlang</label>
                            <select id="filter-department">
                                <option value="kardiologiya" selected>Kardiologiya</option>
                                <option value="ortopediya">Ortopediya</option>
                                <option value="onkologiya">Onkologiya</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-procedure">Muolajani tanlang</label>
                            <select id="filter-procedure">
                                <!-- JS orqali to'ldiriladi -->
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-sort">Saralash</label>
                            <select id="filter-sort">
                                <option value="default">Standart</option>
                                <option value="cheapest">Eng arzon</option>
                                <option value="expensive">Eng qimmat</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="results-header">
                    <h3 id="results-title">Kardiologiya narxlari</h3>
                    <span id="results-count"></span>
                </div>
                <div class="pricing-results-grid" id="pricing-results">
                    <!-- Natijalar JavaScript orqali to'ldiriladi -->
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <!-- Footer kodi -->
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const allData = [
                { id: 1, procedure: 'Angioplastika (1 stent)', price: 3500, department: 'kardiologiya', clinic: 'amrita', clinicName: 'Amrita Hospital', clinicImage: 'images/Amrita/1.jpg' },
                { id: 2, procedure: 'Koronar shuntlash (CABG)', price: 4800, department: 'kardiologiya', clinic: 'amrita', clinicName: 'Amrita Hospital', clinicImage: 'images/Amrita/1.jpg' },
                { id: 3, procedure: 'Angioplastika (1 stent)', price: 3800, department: 'kardiologiya', clinic: 'fortis', clinicName: 'Fortis Escorts', clinicImage: 'https://placehold.co/600x400/ffc107/333333?text=Fortis+Escorts' },
                { id: 4, procedure: 'Koronar shuntlash (CABG)', price: 5200, department: 'kardiologiya', clinic: 'fortis', clinicName: 'Fortis Escorts', clinicImage: 'https://placehold.co/600x400/ffc107/333333?text=Fortis+Escorts' },
                { id: 5, procedure: 'Yurak klapanini almashtirish', price: 7500, department: 'kardiologiya', clinic: 'apollo', clinicName: 'Apollo Hospitals', clinicImage: 'https://placehold.co/600x400/6f42c1/FFFFFF?text=Apollo+Hospitals' },
                
                { id: 6, procedure: 'Tizza bo\'g\'imini almashtirish', price: 4500, department: 'ortopediya', clinic: 'amrita', clinicName: 'Amrita Hospital', clinicImage: 'images/Amrita/Ward.jpg' },
                { id: 7, procedure: 'Chanoq-son bo\'g\'imini almashtirish', price: 5500, department: 'ortopediya', clinic: 'fortis', clinicName: 'Fortis Escorts', clinicImage: 'https://placehold.co/600x400/ffc107/333333?text=Fortis+Escorts' },
                { id: 8, procedure: 'Tizza bo\'g\'imini almashtirish', price: 4900, department: 'ortopediya', clinic: 'apollo', clinicName: 'Apollo Hospitals', clinicImage: 'https://placehold.co/600x400/6f42c1/FFFFFF?text=Apollo+Hospitals' },

                { id: 9, procedure: 'Kimyoterapiya (1 sikl)', price: 800, department: 'onkologiya', clinic: 'amrita', clinicName: 'Amrita Hospital', clinicImage: 'images/Amrita/MRT.jpg' },
                { id: 10, procedure: 'Nur terapiyasi (IMRT)', price: 6000, department: 'onkologiya', clinic: 'apollo', clinicName: 'Apollo Hospitals', clinicImage: 'https://placehold.co/600x400/6f42c1/FFFFFF?text=Apollo+Hospitals' },
            ];

            const departmentFilter = document.getElementById('filter-department');
            const procedureFilter = document.getElementById('filter-procedure');
            const sortFilter = document.getElementById('filter-sort');
            const resultsGrid = document.getElementById('pricing-results');
            const resultsTitle = document.getElementById('results-title');
            const resultsCount = document.getElementById('results-count');

            function updateProcedureFilter() {
                const selectedDepartment = departmentFilter.value;
                const proceduresInDept = [...new Set(allData.filter(p => p.department === selectedDepartment).map(p => p.procedure))];
                
                procedureFilter.innerHTML = '<option value="all">Barcha muolajalar</option>';
                proceduresInDept.forEach(proc => {
                    procedureFilter.innerHTML += `<option value="${proc}">${proc}</option>`;
                });
            }

            function renderResults() {
                const selectedDepartment = departmentFilter.value;
                const selectedProcedure = procedureFilter.value;
                const selectedSort = sortFilter.value;

                resultsTitle.textContent = `${departmentFilter.options[departmentFilter.selectedIndex].text} narxlari`;

                let filteredData = allData.filter(p => p.department === selectedDepartment);

                if (selectedProcedure !== 'all') {
                    filteredData = filteredData.filter(p => p.procedure === selectedProcedure);
                }

                if (selectedSort === 'cheapest') {
                    filteredData.sort((a, b) => a.price - b.price);
                } else if (selectedSort === 'expensive') {
                    filteredData.sort((a, b) => b.price - a.price);
                }

                resultsGrid.innerHTML = '';
                resultsCount.textContent = `${filteredData.length} ta taklif topildi`;

                if (filteredData.length === 0) {
                    resultsGrid.innerHTML = '<div id="no-results">Ushbu mezonlar bo\'yicha natijalar topilmadi.</div>';
                    return;
                }

                filteredData.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'price-result-card';
                    card.innerHTML = `
                        <div class="card-image">
                            <img src="${item.clinicImage}" alt="${item.clinicName}" onerror="this.onerror=null;this.src='https://placehold.co/600x400/cccccc/FFFFFF?text=Klinika';">
                        </div>
                        <div class="card-content">
                            <h4 class="procedure-name">${item.procedure}</h4>
                            <p class="clinic-name">${item.clinicName}</p>
                            <div class="price-info">
                                <div class="price-tag-results">$${item.price.toLocaleString()}</div>
                                <a href="#" class="btn-request">So'rov yuborish</a>
                            </div>
                        </div>
                    `;
                    resultsGrid.appendChild(card);
                    
                    // Animatsiya uchun
                    setTimeout(() => {
                        card.classList.add('visible');
                    }, index * 100); // Har bir keyingi karta 100ms kechikish bilan paydo bo'ladi
                });
            }

            departmentFilter.addEventListener('change', () => {
                updateProcedureFilter();
                renderResults();
            });
            procedureFilter.addEventListener('change', renderResults);
            sortFilter.addEventListener('change', renderResults);

            updateProcedureFilter();
            renderResults();
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
