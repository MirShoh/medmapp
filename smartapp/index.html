<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaktika Qahramoni - Bolajonlar uchun</title>
    
    <!-- Asosiy Stillar (Sizdagi css fayl) -->
    <link rel="stylesheet" href="style.css">

    <!-- Three.js (3D Grafika uchun kutubxona) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- MediaPipe (Qo'l harakatini aniqlash uchun sun'iy intellekt) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- YUKLASH EKRANI -->
    <div id="loading-screen">
        <h1 class="game-title">GALAKTIKA QAHRAMONI</h1>
        <p class="game-subtitle">Bolajonlar uchun 3D Sarguzasht</p>
        <div id="status-text">AI yuklanmoqda...</div>
        <button id="start-btn" class="start-btn" disabled>BOSHLASH 🚀</button>
    </div>

    <!-- O'YIN INTERFEYSI (UI) -->
    <div id="ui-layer">
        <div class="header-panel">
            <h1 id="level-name">1-SAYYORA: YER</h1>
            <div class="task-text">PAROL: <span id="target-code">YER</span></div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        
        <!-- Robot so'zlari -->
        <div class="robot-msg" id="robot-msg">Salom! Men Roboman!</div>
    </div>

    <!-- AVATAR QUTISI (Robotcha turadigan joy) -->
    <div id="avatar-container"></div>

    <!-- G'ALABA EKRANI -->
    <div id="win-modal">
        <h1 class="win-title">BARAKALLA! 🎉</h1>
        <div class="star-rating">⭐⭐⭐</div>
        <p id="planet-unlocked-text">YER SAYYORASI OCHILDI</p>
        <button id="next-btn">KEYINGI SAYYORA >></button>
    </div>
    
    <!-- KAMERA VA KANVAS -->
    <video id="input-video" playsinline webkit-playsinline muted autoplay style="display:none"></video>
    <canvas id="video-preview"></canvas>
    <div id="canvas-container"></div>

    <!-- Asosiy Mantiq (JavaScript) -->
    <script src="script.js"></script>
</body>
</html>
